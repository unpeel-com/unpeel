[package]
name = "unpeel-usage"
version = "0.1.0"
edition = "2021"
description = "Local AI usage & credits at a glance — a standalone terminal dashboard that lights up as an Unpeel App"
license = "MIT"

[dependencies]
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
sha2 = "0.10"
toml = "0.8"
unpeel-app-kit = { path = "../unpeel-app-kit" }
ureq = "3"

[profile.release]
lto = true
strip = true
