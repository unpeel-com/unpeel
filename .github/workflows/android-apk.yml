# Release APK for the phone Controller. Artifact only — never creates or
# updates a GitHub Release. Download from the Actions run page.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [android/termit]
    paths:
      - 'clients/android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            clients/android/**/*.gradle*
            clients/android/gradle/wrapper/gradle-wrapper.properties

      # Default package list includes the retired `tools` package; pin what we need.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Decode release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/unpeel-android.jks"
          echo "ANDROID_KEYSTORE_FILE=${RUNNER_TEMP}/unpeel-android.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Protocol tests + release APK
        working-directory: clients/android
        run: ./gradlew :protocol:test :app:assembleRelease --no-daemon

      - name: Name release APK
        id: apk
        run: |
          src=clients/android/app/build/outputs/apk/release/app-release.apk
          test -f "$src"
          ver=$(python3 -c '
          import re
          text = open("clients/android/app/build.gradle.kts").read()
          code = re.search(r"versionCode\s*=\s*(\d+)", text).group(1)
          name = re.search(r"versionName\s*=\s*\"([^\"]+)\"", text).group(1)
          print(f"{name}-{code}")
          ')
          out="Unpeel-Termit-${ver}.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: unpeel-android-release-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
