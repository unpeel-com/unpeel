# Debug APK for the phone Controller. Artifact only — never creates or
# updates a GitHub Release. Download from the Actions run page.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [android/termit]
    paths:
      - 'clients/android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            clients/android/**/*.gradle*
            clients/android/gradle/wrapper/gradle-wrapper.properties

      # Default package list includes the retired `tools` package; pin what we need.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Protocol tests + debug APK
        working-directory: clients/android
        run: ./gradlew :protocol:test :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: unpeel-android-debug-${{ github.sha }}
          path: clients/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
