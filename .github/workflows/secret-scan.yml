# Secret scanning on every push and PR, from commit 1 — an open-source.md
# publication requirement. Runs the gitleaks CLI directly (the marketplace
# action needs a paid license key for org repos; the CLI does not).
#
# Every run scans the FULL git history (fetch-depth 0 + `gitleaks git`), not
# just the changed files, with the repo's `.gitleaks.toml` allowlist of
# verified test fixtures. A weekly scheduled run catches a rule update or a
# history rewrite that a push would not trigger.
name: Secret scan

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC, full history
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks scans every commit, not just the tip.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan the full repository history
        run: gitleaks git --config .gitleaks.toml --no-banner --redact --verbose .
