# The Apple clients (apps/native, apps/ios, apps/shared) and the C-ABI bridge
# crate build from this tree. One macOS job, kept cheap (macOS minutes cost
# 10x): an unsigned Mac app assembled through the default from-source path,
# the iOS package tests in a simulator, and the shared package's `swift test`.
# No signing identities, notary credentials, or Sparkle keys exist here;
# official signed builds are cut by the release scripts on an operator's Mac.
name: Apple clients

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'crates/unpeel-native-bridge/**'
      - '.github/workflows/clients.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'crates/unpeel-native-bridge/**'
      - '.github/workflows/clients.yml'

permissions:
  contents: read

concurrency:
  group: clients-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-clients:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest installed Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install declared Rust MSRV
        uses: dtolnay/rust-toolchain@1.88.0
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates
            crates/unpeel-attach
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            apps/native/UnpeelNative/.build
            apps/shared/UnpeelShared/.build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ hashFiles('apps/**/Package.resolved', 'apps/native/vendor/libghostty-spm/Package.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-
      - name: Runtime catalog copies agree
        run: bun run check:runtimes
      - name: UnpeelShared tests
        run: swift test --package-path apps/shared/UnpeelShared
      - name: Unsigned Mac app (server + bridge built from this tree)
        env:
          CODESIGN_IDENTITY: '-'
          UNPEEL_DEV_BUILD: '0'
          UNPEEL_BUILD: ${{ github.run_number }}
        run: apps/native/build-app.sh
      - name: iOS package tests (simulator)
        env:
          UNPEEL_IOS_TEST_DESTINATION: 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest'
          UNPEEL_IOS_TEST_DERIVED_DATA: ${{ runner.temp }}/unpeel-ios-tests
        run: apps/ios/test-ios.sh
