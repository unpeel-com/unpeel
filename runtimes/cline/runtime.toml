schema_version = 1
id = "bot.cline.cli"
slug = "cline"
legacy_slug = "cline"
label = "Cline"
adapter = "builtin:cline"
legacy_order = 2
platforms = ["macos", "linux"]
supports_quick_launch = true
capabilities = ["lifecycle_hooks", "resume", "restart_agent", "mcp_sessions", "mcp_browser", "mcp_computer", "transcript", "notify_when_done"]

[display]
tint = "#F26C5A"
spinner_tint = "#98C4FA"
icon = "cline"
icon_asset = "assets/icon.svg"
icon_source = "internal:legacy-unpeel-tool-icons"
icon_license = "vendor-brand-asset"
window_padding_x = 8

[install]
official_url = "https://cline.bot"
command = "npm install -g cline"

[detection]
command_aliases = ["cline"]
process_aliases = ["cline"]
script_path_signatures = []

[lifecycle]
source = "hooks"
authority = "partial"
fallback = "none"
completion_reliable = true
attention_reliable = false

[[usage.stores]]
root = ".cline/data/sessions"
extensions = ["json"]
file_name_suffix = ".messages.json"

[[suggested_presets]]
id = "cline"
label = "cline"
command = "cline"
quick_launch = false
