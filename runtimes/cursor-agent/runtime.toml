schema_version = 1
id = "com.cursor.agent"
slug = "cursor-agent"
legacy_slug = "cursor-agent"
label = "Cursor Agent"
adapter = "builtin:cursor-agent"
legacy_order = 8
platforms = ["macos", "linux"]
supports_quick_launch = true
capabilities = ["lifecycle_hooks", "resume", "restart_agent", "mcp_sessions", "mcp_browser", "mcp_computer", "transcript", "notify_when_done"]

[display]
tint = "#22C55D"
spinner_tint = "#22C55D"
icon = "cursor"
icon_asset = "assets/icon.svg"
icon_source = "internal:legacy-unpeel-tool-icons"
icon_license = "vendor-brand-asset"
window_padding_x = 8

[install]
official_url = "https://cursor.com/cli"
command = "curl https://cursor.com/install -fsS | bash"

[detection]
command_aliases = ["cursor-agent"]
process_aliases = ["cursor-agent"]
script_path_signatures = []

[lifecycle]
source = "hooks"
authority = "complete"
fallback = "none"
completion_reliable = true
attention_reliable = true

[[usage.stores]]
root = ".cursor/projects"
extensions = ["jsonl"]

[[suggested_presets]]
id = "cursor-agent"
label = "cursor-agent --force"
command = "cursor-agent --force"
quick_launch = false
