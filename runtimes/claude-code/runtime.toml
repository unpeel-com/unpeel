schema_version = 1
id = "com.anthropic.claude-code"
slug = "claude-code"
legacy_slug = "claude"
label = "Claude"
adapter = "builtin:claude"
legacy_order = 0
platforms = ["macos", "linux"]
supports_quick_launch = true
capabilities = ["lifecycle_hooks", "resume", "restart_agent", "mcp_sessions", "mcp_browser", "mcp_computer", "transcript", "notify_when_done", "semantic_terminal_title"]

[display]
tint = "#D97757"
spinner_tint = "#D97757"
icon = "claude"
icon_asset = "assets/icon.svg"
icon_source = "internal:legacy-unpeel-tool-icons"
icon_license = "vendor-brand-asset"
window_padding_x = 8

[install]
official_url = "https://claude.com/claude-code"
command = "curl -fsSL https://claude.ai/install.sh | bash"
# The shell builtin keeps this maintenance command out of managed agent launch.
update_command = "command claude update"

[updates]
version_args = ["--version"]
latest_url = "https://downloads.claude.ai/claude-code-releases/latest"
channel_settings_path = ".claude/settings.json"
channel_settings_pointer = "/autoUpdatesChannel"
channel_urls = { stable = "https://downloads.claude.ai/claude-code-releases/stable", latest = "https://downloads.claude.ai/claude-code-releases/latest" }

[detection]
command_aliases = ["claude"]
process_aliases = ["claude", "claude-code"]
script_path_signatures = [{ components = ["@anthropic-ai", "claude-code"] }]

[environment]
strip_inherited = ["CLAUDE_CODE_CHILD_SESSION", "CLAUDECODE", "CLAUDE_CODE_ENTRYPOINT", "CLAUDE_CODE_SESSION_ID", "CLAUDE_PID"]

[lifecycle]
source = "hooks"
authority = "complete"
fallback = "none"
completion_reliable = true
attention_reliable = true

[[usage.stores]]
root = ".claude/projects"
extensions = ["jsonl"]

[[suggested_presets]]
id = "claude"
label = "claude"
command = "claude"
quick_launch = true
