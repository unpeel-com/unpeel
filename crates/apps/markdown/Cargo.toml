[package]
name = "unpeel-markdown"
version = "0.1.0"
edition = "2024"
description = "A beautiful terminal markdown editor — standalone first, an Unpeel App when Unpeel is around"
license = "MIT"

[dependencies]
color-eyre = "0.6"
ratatui = "0.30"
serde_json = "1"
similar = "3"
tui-textarea = { package = "tui-textarea-2", version = "0.12" }
unicode-width = "0.2"
unpeel-app-kit = { path = "../unpeel-app-kit", features = ["markdown-text-area"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
