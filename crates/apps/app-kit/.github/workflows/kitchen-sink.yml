name: Kitchen Sink (manual)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - name: Build child Apps
        run: >-
          cargo build
          --features markdown-text-area,media,surface-embed
          --example todo
          --example markdown
          --example media
          --example surface_planets
          --example surface_canvas
      - name: Test renderer library
        run: swift test --package-path swift
      - name: Test and bundle web renderer
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun test
          bun run check
          bun run build:kitchen-sink
          git diff --exit-code -- ../swift/Examples/KitchenSink/Sources/KitchenSink/Resources/Web/app.js
      - name: Build standalone mini-host
        run: swift build --package-path swift/Examples/KitchenSink
