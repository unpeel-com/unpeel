<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval' http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; img-src data: blob:; connect-src http://127.0.0.1:*"
    >
    <meta name="color-scheme" content="light dark">
    <title>App Kit web renderer</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="renderer-shell">
      <div id="revision" class="revision" aria-live="polite">waiting</div>
      <main id="app" aria-label="App Kit web component"></main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
