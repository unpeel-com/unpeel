[package]
name = "unpeel-core"
description = "Unpeel session backend: hosted PTY sessions, provider integrations, hook assets, MCP host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Preserve the shipped Host/backend build for every existing consumer. Web
# Controllers opt into only the transport-neutral semantic and wire layers.
default = ["native-host"]
# Allocator integration (Round 4, Lane 2): route release_memory_to_os through
# mimalloc's collect when unpeel-host is built with --features mimalloc.
mimalloc = ["dep:libmimalloc-sys"]
controller-core = [
    "dep:base64",
    "dep:serde",
    "dep:serde_json",
    "dep:uuid",
]
native-host = [
    "controller-core",
    "dep:dirs",
    "dep:libc",
    "dep:log",
    "dep:md5",
    "dep:portable-pty",
    "dep:anyhow",
    "dep:rcgen",
    "dep:ring",
    "dep:rustls",
    "dep:sha1",
    "dep:sha2",
    "dep:toml",
    "dep:webpki-roots",
]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
log = { version = "0.4", optional = true }
portable-pty = { version = "0.8", optional = true }
anyhow = { version = "1", optional = true }
libc = { version = "0.2", optional = true }
libmimalloc-sys = { version = "0.1", optional = true, features = ["extended"] }
base64 = { version = "0.22", optional = true }
toml = { version = "0.8", optional = true }
dirs = { version = "6", optional = true }
uuid = { version = "1", features = ["v4", "js"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
rcgen = { version = "0.13", optional = true }
sha1 = { version = "0.10", optional = true }
ring = { version = "0.17", optional = true }
webpki-roots = { version = "0.26", optional = true }
sha2 = { version = "0.10", optional = true }
md5 = { version = "0.7", optional = true }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
toml = { version = "0.8", optional = true }

[[example]]
name = "ssh_host_probe"
required-features = ["native-host"]
