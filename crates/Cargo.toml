[workspace]
resolver = "2"
members = [
    "license-notices",
    "unpeel-core",
    "unpeel-host",
    "unpeel-apps",
    "unpeel-serve",
    "unpeel-cli",
    "unpeel-native-bridge",
]
# The first-party Apps and the App Kit are their own workspace
# (`crates/apps/Cargo.toml`): separate cadence, separate versions, and a
# TUI dependency tree the Host's gates should not pay for.
exclude = ["apps"]

[workspace.package]
version = "0.6.1"
edition = "2021"
# Locked dependencies (notably plist/time/instability) require Rust 1.88.
# Keep this honest with the MSRV check in .github/workflows/linux-cli.yml.
rust-version = "1.88.0"
license = "MIT"
authors = ["Unpeel"]

[profile.release]
strip = true
