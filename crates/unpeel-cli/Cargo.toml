[package]
name = "unpeel-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The unpeel CLI: the UI-free Host service (`unpeel serve`) and scriptable verbs over Unpeel sessions"

[[bin]]
name = "unpeel"
path = "src/main.rs"

[dependencies]
unpeel-core = { path = "../unpeel-core" }
unpeel-serve = { path = "../unpeel-serve" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
